name: lint-skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint all skills
        run: |
          status=0
          while IFS= read -r f; do
            ./lint.sh "$f" || status=1
          done < <(find skills -name SKILL.md | sort)
          if [ "$status" -ne 0 ]; then
            echo "::error::Skill lint failed (see lint output above)"
          fi
          exit "$status"
